<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>girlmeet 💕 — squad scheduler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="page">
  <header class="hero">
    <div class="floating-icons">
      <span class="floating-icon" style="top:12%;left:7%;animation-delay:0s">🌸</span>
      <span class="floating-icon" style="top:18%;right:9%;animation-delay:1.1s">✨</span>
      <span class="floating-icon" style="top:62%;left:4%;animation-delay:2.2s">🦋</span>
      <span class="floating-icon" style="top:68%;right:6%;animation-delay:0.6s">🌷</span>
      <span class="floating-icon" style="top:40%;left:2%;animation-delay:1.7s">🎀</span>
    </div>
    <div class="logo">girlmeet <span class="logo-emoji">💕</span></div>
    <p class="tagline">find the perfect time for your squad 🌸</p>
  </header>

  <main class="card">
    <h2>create a new event 🎀</h2>

    <div class="form-group">
      <label>event name</label>
      <input type="text" id="eventName" placeholder="brunch? coffee date? girls trip?? ✨" maxlength="60" autocomplete="off" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>start date</label>
        <input type="date" id="startDate" />
      </div>
      <div class="form-group">
        <label>end date <span style="font-size:0.72rem;color:var(--text-light);font-weight:600">(max 2 weeks)</span></label>
        <input type="date" id="endDate" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>earliest time</label>
        <select id="startTime"></select>
      </div>
      <div class="form-group">
        <label>latest time</label>
        <select id="endTime"></select>
      </div>
    </div>

    <button class="btn-primary" id="createBtn">create event 🌸</button>
  </main>

  <p style="text-align:center;color:var(--text-light);font-size:0.82rem;font-weight:600;margin-top:1.75rem">
    made with 💕 for girl groups everywhere
  </p>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="js/create.js"></script>
</body>
</html>
