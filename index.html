<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grad Girls Sync 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Satisfy&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

<div class="page">
  <header class="hero">
    <div class="floating-icons">
      <span class="floating-icon fi-float"  style="top:8%;left:6%;animation-delay:0s;font-size:1.6rem">🌸</span>
      <span class="floating-icon fi-twinkle" style="top:15%;right:8%;animation-delay:0.8s;font-size:1.2rem">✨</span>
      <span class="floating-icon fi-spin"   style="top:55%;left:3%;animation-delay:1.5s;font-size:1.4rem">🦋</span>
      <span class="floating-icon fi-float"  style="top:70%;right:5%;animation-delay:0.4s;font-size:1.3rem">🌷</span>
      <span class="floating-icon fi-bounce" style="top:38%;left:1%;animation-delay:2s;font-size:1.1rem">🎀</span>
      <span class="floating-icon fi-twinkle" style="top:80%;left:10%;animation-delay:1.2s;font-size:1rem">💫</span>
      <span class="floating-icon fi-float"  style="top:25%;left:15%;animation-delay:3s;font-size:0.9rem">🍒</span>
      <span class="floating-icon fi-spin"   style="top:90%;right:12%;animation-delay:0.2s;font-size:1.1rem">🌟</span>
      <span class="floating-icon fi-bounce" style="top:48%;right:3%;animation-delay:2.5s;font-size:1.2rem">🌺</span>
      <span class="floating-icon fi-twinkle" style="top:5%;left:40%;animation-delay:1.8s;font-size:1rem">🍓</span>
    </div>
    <div class="logo">Grad Girls Sync <span class="logo-emoji">💕</span></div>
    <p class="tagline">because miss you, when? 🥺</p>
  </header>

  <main class="card">
    <h2>create a new event 🎀</h2>

    <div class="form-group">
      <label>event name</label>
      <input type="text" id="eventName" placeholder="brunch? coffee date? girls trip?? ✨" maxlength="60" autocomplete="off" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>start date</label>
        <input type="date" id="startDate" />
      </div>
      <div class="form-group">
        <label>end date</label>
        <input type="date" id="endDate" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>earliest time</label>
        <select id="startTime"></select>
      </div>
      <div class="form-group">
        <label>latest time</label>
        <select id="endTime"></select>
      </div>
    </div>

    <button class="btn-primary" id="createBtn">create event 🌸</button>
  </main>

  <p style="text-align:center;color:var(--text-light);font-size:0.82rem;font-weight:500;margin-top:1.75rem">
    made with 💕 for grad girls everywhere
  </p>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="js/create.js"></script>
</body>
</html>
